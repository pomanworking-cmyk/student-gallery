<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>學生作品畫廊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Chiron+GoRound+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261113e">
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="app">
  <!-- 首頁 -->
  <section id="screen-home" class="screen">
    <header class="home-head">
      <div class="home-kicker">GALLERY</div>
      <h1 id="site-name">學生作品畫廊</h1>
      <p class="home-sub">揀一個畫廊入去參觀</p>
    </header>
    <div id="gallery-list" class="gallery-list"></div>
    <footer class="home-foot">
      <span id="mode-badge"></span>
      <a href="#admin" class="link-quiet" id="home-admin">老師管理</a>
    </footer>
  </section>

  <!-- 入口（未有連結） -->
  <section id="screen-landing" class="screen center hidden">
    <div class="card who-card">
      <div class="who-cat"><img src="stickers/wow.webp" alt=""></div>
      <h2 id="landing-title">學生作品畫廊</h2>
      <div id="landing-body"></div>
    </div>
  </section>

  <!-- 你係邊個 -->
  <section id="screen-who" class="screen center hidden">
    <div class="card who-card">
      <div class="who-cat"><img src="stickers/love.webp" alt=""></div>
      <h2>歡迎參觀！</h2>
      <p class="muted" id="who-gallery-name"></p>
      <div class="seg" role="tablist">
        <button class="seg-btn active" data-who="student">我係學生</button>
        <button class="seg-btn" data-who="teacher">老師／嘉賓</button>
      </div>
      <form id="who-student" class="who-form">
        <label>班別
          <select id="who-class" required></select>
        </label>
        <label>學號
          <input id="who-no" type="number" inputmode="numeric" min="1" max="60" required placeholder="例如 12">
        </label>
        <label id="who-name-wrap" class="hidden">你嘅名
          <input id="who-name" type="text" maxlength="20" placeholder="名單搵唔到你，請輸入名">
        </label>
        <div id="who-confirm" class="who-confirm hidden"></div>
        <button class="btn primary big" type="submit">入去參觀 →</button>
      </form>
      <form id="who-teacher" class="who-form hidden">
        <label>稱呼
          <input id="who-tname" type="text" maxlength="20" placeholder="例如 陳老師" required>
        </label>
        <button class="btn primary big" type="submit">入去參觀 →</button>
      </form>
      <button class="link-quiet" id="who-back">← 返回畫廊列表</button>
    </div>
  </section>

  <!-- 3D 畫廊 -->
  <section id="screen-3d" class="screen hidden">
    <div id="three-host"></div>
    <div class="hud-top">
      <button class="hud-btn" id="btn-home" aria-label="返回">✕</button>
      <div class="hud-title" id="hud-title"></div>
      <button class="hud-chip" id="hud-me"></button>
    </div>
    <div class="hud-row2">
      <button class="hud-chip hidden" id="hud-room"></button>
      <button class="hud-chip hidden" id="hud-sun"></button>
      <button class="hud-chip hidden" id="hud-steps"></button>
    </div>
    <canvas id="minimap" class="minimap hidden" width="150" height="220"></canvas>
    <div class="hud-panel hidden" id="steps-panel"></div>
    <div class="hud-panel hidden" id="room-menu"></div>
    <div class="hud-panel hidden" id="sun-panel">
      <div class="sun-lab" id="sun-lab"></div>
      <input type="range" id="sun-range" min="5.5" max="21" step="0.25">
      <div class="sun-presets"><button data-h="7">🌅 朝早</button><button data-h="12">☀️ 正午</button><button data-h="17.5">🌇 黃昏</button><button data-h="21">🌙 夜晚</button></div>
      <button class="link-quiet" id="sun-reset">跟返老師嘅設定</button>
    </div>
    <div class="hud-hint" id="hud-hint"></div>
    <div class="joystick" id="joystick"><div class="knob"></div></div>
    <div class="hud-nav" id="hud-nav">
      <button class="hud-btn round" id="btn-prev" aria-label="上一幅">‹</button>
      <button class="hud-btn round" id="btn-next" aria-label="下一幅">›</button>
    </div>
    <div class="fade" id="fade"></div>
    <div class="done hidden" id="done"><div class="done-box"><img src="stickers/wow.webp" alt=""><h2>參觀完成！🏅</h2><p id="done-msg"></p><button class="btn primary big" id="done-ok">好嘢！</button></div></div>
  </section>

  <!-- 作品詳情 -->
  <div id="modal-art" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box art-box">
      <button class="modal-close" data-close>✕</button>
      <div class="art-view" id="art-view"></div>
      <div class="art-side">
        <div class="art-nav">
          <button class="btn ghost small" id="art-prev">‹ 上一幅</button>
          <button class="btn ghost small" id="art-next">下一幅 ›</button>
        </div>
        <h2 id="art-title"></h2>
        <p class="art-author" id="art-author"></p>
        <div id="art-audio" class="art-audio hidden"><span>🔊 聽作者介紹</span><audio id="art-audio-el" controls preload="none"></audio></div>
        <div id="praise-box"></div>
        <h3 class="praise-head">大家嘅讚賞 <span id="praise-count"></span></h3>
        <ul class="praise-list" id="praise-list"></ul>
      </div>
    </div>
  </div>

  <!-- 老師管理 -->
  <section id="screen-admin" class="screen hidden"></section>

  <div id="toast" class="toast"></div>
  <div id="dialog" class="modal hidden"><div class="modal-box dialog-box"><p id="dialog-msg"></p><div class="dialog-actions"><button class="btn ghost" id="dialog-no">取消</button><button class="btn danger" id="dialog-yes">確定</button></div></div></div>
  <div id="fly" class="fly"></div>
</div>
<script type="module" src="js/app.js?v=20261113e"></script>
</body>
</html>
